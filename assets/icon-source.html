<!doctype html>
<html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0;}
  .icon{
    width:512px;height:512px;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(160deg,#bfe9f2,#f4d35e 130%);
  }
  .icon.maskable{ /* extra safe-zone padding: content inside ~80% circle */ }
  svg{display:block;}
</style></head>
<body>
  <div class="icon" id="icon">
    <svg width="512" height="512" viewBox="0 0 512 512">
      <defs>
        <radialGradient id="bg" cx="35%" cy="30%" r="80%">
          <stop offset="0%" stop-color="#d7f4ee"/>
          <stop offset="100%" stop-color="#3fb6a8"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>
      <!-- bear body -->
      <ellipse cx="256" cy="300" rx="150" ry="150" fill="#3fb6a8"/>
      <ellipse cx="256" cy="336" rx="86" ry="76" fill="#e7f8f3"/>
      <!-- ears -->
      <circle cx="168" cy="178" r="42" fill="#f2a45e"/>
      <circle cx="344" cy="178" r="42" fill="#f2a45e"/>
      <circle cx="168" cy="178" r="20" fill="#fff0dc"/>
      <circle cx="344" cy="178" r="20" fill="#fff0dc"/>
      <!-- eyes -->
      <circle cx="212" cy="260" r="15" fill="#2c3e50"/>
      <circle cx="300" cy="260" r="15" fill="#2c3e50"/>
      <circle cx="217" cy="255" r="4" fill="#ffffff"/>
      <circle cx="305" cy="255" r="4" fill="#ffffff"/>
      <!-- muzzle -->
      <ellipse cx="256" cy="300" rx="30" ry="22" fill="#ffffff"/>
      <ellipse cx="256" cy="292" rx="12" ry="9" fill="#2c3e50"/>
      <path d="M 256 300 Q 256 316 240 320" stroke="#2c3e50" stroke-width="5" fill="none" stroke-linecap="round"/>
      <path d="M 256 300 Q 256 316 272 320" stroke="#2c3e50" stroke-width="5" fill="none" stroke-linecap="round"/>
      <!-- coin badge -->
      <circle cx="378" cy="378" r="54" fill="#f4d35e" stroke="#fff" stroke-width="8"/>
      <text x="378" y="396" font-family="Verdana, sans-serif" font-size="52" font-weight="bold" fill="#8a6d1e" text-anchor="middle">₽</text>
    </svg>
  </div>
</body></html>
